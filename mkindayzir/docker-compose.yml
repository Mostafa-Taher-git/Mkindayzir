services:
  mkindayzir:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://mkindayzir:${POSTGRES_PASSWORD}@db:5432/mkindayzir
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NODE_ENV=production
      - BASE_URL=${NEXTAUTH_URL}
      - PORT=3000
    volumes:
      - upload-data:/app/data/uploads
      - backup-data:/app/data/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mkindayzir
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mkindayzir
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkindayzir -d mkindayzir"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  upload-data:
  backup-data:
  db-data:
