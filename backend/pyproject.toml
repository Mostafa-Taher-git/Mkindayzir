[project]
name = "mkindayzir-backend"
version = "1.0.0"
description = "Mkindayzir FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic-settings>=2.0",
    "cryptography>=43",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.10",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
mkindayzir = "app.cli.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
