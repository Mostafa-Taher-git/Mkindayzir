    <script>
      (function () {
        // The Mecha design system is dark-only; always pin dark.
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.className = document.documentElement.className
          .replace(/dark|light/g, "")
          .trim() + " dark";
      })();
    </script>
