version: '3.8'

services:
  app:
    image: ghcr.io/your-org/mkindayzir:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - mkindayzir_data:/app/data
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env
    restart: unless-stopped
    profiles:
      - team
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkindayzir -d mkindayzir"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mkindayzir_data:
  pgdata:
