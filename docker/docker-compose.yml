# =============================================================================
# Mkindayzir — canonical single-process compose
#
# One `app` service builds the root Dockerfile (FastAPI + built Vite SPA) and
# publishes a single port 8000. PostgreSQL 16 is the database for every mode
# and runs as a companion service on the `db` network alias.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#
# The app connects with:
#   DATABASE_PROVIDER=postgres
#   DATABASE_URL=postgresql+asyncpg://mkindayzir:mkindayzir@db:5432/mkindayzir
# =============================================================================
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mkindayzir:latest
    ports:
      - "8000:8000"
    environment:
      - DATA_DIR=/app/data
      - FRONTEND_DIR=/app/dist
      - DATABASE_PROVIDER=postgres
      - DATABASE_URL=postgresql+asyncpg://mkindayzir:${POSTGRES_PASSWORD:-mkindayzir}@db:5432/mkindayzir
    volumes:
      - mkindayzir_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mkindayzir}
      - POSTGRES_USER=${POSTGRES_USER:-mkindayzir}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mkindayzir}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkindayzir"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mkindayzir_data:
  pgdata:
