[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkindayzir"
version = "1.0.0"
description = "Mkindayzir — Operations control platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mkindayzir" }]

[project.optional-dependencies]
dev = [
    "mkindayzir-backend[dev]",
]

[project.scripts]
mkindayzir = "app.cli.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.sdist]
include = [
    "/backend",
    "/scripts",
    "/docker",
    "/README.md",
]
