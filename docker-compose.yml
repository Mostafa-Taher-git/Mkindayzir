version: '3.8'
services:
  mkindayzir:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - MKINDAYZIR_MODE=team
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://mkindayzir:${DB_PASSWORD}@db:5432/mkindayzir
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NODE_ENV=production
      - BASE_URL=http://localhost:80
      - PORT=80
      - AUTO_LOGIN=false
      - PYTHON_AI_URL=http://mkindayzir-ai:8000
    volumes:
      - upload-data:/app/data/uploads
      - backup-data:/app/data/backups
    depends_on:
      db:
        condition: service_healthy
      mkindayzir-ai:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mkindayzir-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NEXTJS_URL=http://mkindayzir:80
      - DEFAULT_AI_PROVIDER=openrouter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mkindayzir
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=mkindayzir
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkindayzir -d mkindayzir"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  upload-data:
  backup-data:
  pg-data:
