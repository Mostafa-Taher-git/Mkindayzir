<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/MKINDAYZIR_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mkindayzir - Your Operations, Your Server, Your Control.</title>
    <meta
      name="description"
      content="Self-hosted, local-first, offline-capable Work OS"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var t = localStorage.getItem("mkindayzir-theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        document.documentElement.className = document.documentElement.className
          .replace(/dark|light/g, "")
          .trim() + " " + (t === "light" ? "light" : "dark");
      })();
    </script>
  </head>
  <body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
