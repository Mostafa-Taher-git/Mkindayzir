services:
  mkindayzir:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - MKINDAYZIR_MODE=team
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://mkindayzir:${DB_PASSWORD}@db:5432/mkindayzir
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NODE_ENV=development
      - BASE_URL=http://localhost:3000
      - PORT=3000
      - AUTO_LOGIN=false
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - upload-data:/app/data/uploads
      - backup-data:/app/data/backups
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://mkindayzir:${DB_PASSWORD}@db:5432/mkindayzir
      - DATA_DIR=/app/data
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENV=development
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mkindayzir
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=mkindayzir
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkindayzir -d mkindayzir"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  upload-data:
  backup-data:
  db-data:
